
name: ManualBuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0

    steps:
      - name: Checkout EliteRedux
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check base ROM
        run: |
          test -f rom.gba || {
            echo "ERROR: rom.gba was not found in the repository root."
            exit 1
          }
          ls -lh rom.gba

      - name: Checkout proto files
        run: |
          rm -rf proto

          git clone --depth 1 --branch upcoming \
            https://github.com/Elite-Redux/er-config.git proto

          test -d proto

      - name: Enable overworld debug shortcut
        run: |
          sed -i -E \
            's/^(#define TX_DEBUG_SYSTEM_IN_MENU[[:space:]]+)TRUE/\1FALSE/' \
            include/debug.h

          grep -Eq \
            '^#define TX_DEBUG_SYSTEM_IN_MENU[[:space:]]+FALSE' \
            include/debug.h

      - name: Test fix for initial Pokemon moves
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/pokemon.c")
          source = path.read_text()

          signature = "void GiveBoxMonInitialMoveset(struct BoxPokemon* boxMon) {"
          start = source.index(signature)
          end = source.index("\n}", start) + 2

          original = source[start:end]

          old = "RandomizeMoves(gLevelUpLearnsets[species][i].move, species, personality)"
          new = "gLevelUpLearnsets[species][i].move"

          if original.count(old) != 2:
              raise SystemExit(
                  "ERROR: Expected exactly two RandomizeMoves calls."
              )

          modified = original.replace(old, new)
          source = source[:start] + modified + source[end:]

          path.write_text(source)

          print("Initial moveset test patch applied.")
          print(modified)
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            libpng-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            unzip \
            wget \
            openjdk-17-jdk

      - name: Install modern Kotlin compiler
        run: |
          KOTLIN_VERSION=2.1.0

          wget -q \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -O "$RUNNER_TEMP/kotlin.zip"

          mkdir -p "$RUNNER_TEMP/kotlin"

          unzip -q "$RUNNER_TEMP/kotlin.zip" \
            -d "$RUNNER_TEMP/kotlin"

          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" -version

      - name: Download Poryscript
        run: |
          cd tools

          rm -rf poryscript poryscript-linux poryscript-linux.zip

          wget -O poryscript-linux.zip \
            https://github.com/huderlem/poryscript/releases/download/3.5.2/poryscript-linux.zip

          unzip -o poryscript-linux.zip

          mv poryscript-linux poryscript

          rm poryscript-linux.zip

          cd ..

      - name: Fix compiler compatibility flags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Makefile")
          source = path.read_text()

          source = source.replace("-std=gnu23", "-std=gnu2x")
          source = re.sub(r"-Werror\b", "-Wno-error", source)

          path.write_text(source)

          if re.search(r"-Werror\b", source):
              raise SystemExit("ERROR: -Werror still present.")

          print("Compiler compatibility flags updated.")
          PY

          grep -nE 'gnu2x|Wno-error' Makefile

      - name: Diagnose missing legendary sage header
        run: |
          {
            echo "=== Source revision ==="
            git log -1 --format='%h %s'

            echo
            echo "=== Missing header references ==="
            git grep -n 'legendary_sage.h' || true

            echo
            echo "=== Generated mega files ==="
            ls -la include/generated/data/megas/ || true
            ls -la generated/data/megas/ || true

            echo
            echo "=== Search for legendary sage ==="
            find . -iname '*legendary*sage*' -print | head -60

            echo
            echo "=== Config revision ==="
            git -C proto log -1 --format='%h %s'

            echo
            echo "=== Config references ==="
            git -C proto grep -n 'legendary_sage' | head -40 || true

            echo
            echo "=== Relevant include files ==="
            sed -n '1,70p' include/constants/items.h

            echo
            echo "=== Generation references ==="
            grep -RIn \
              --exclude-dir=.git \
              --exclude-dir=build \
              --exclude='*.gba' \
              'generated/data/megas' \
              Makefile scripts tools 2>/dev/null | head -60 || true

          } 2>&1 | tee legendary_sage_diagnostic.txt

      - name: Build EliteRedux
        run: |
          make -j"$(nproc)"

      - name: Verify EliteRedux ROM
        run: |
          test -f pokeemerald_modern.gba
          ls -lh pokeemerald_modern.gba

      - name: Create BPS patch from rom.gba
        run: |
          chmod +x ./flips-linux

          ./flips-linux --create \
            rom.gba \
            pokeemerald_modern.gba \
            EliteRedux.bps

          test -f EliteRedux.bps
          ls -lh EliteRedux.bps

      - name: Apply patch to rom.gba
        run: |
          ./flips-linux --apply \
            EliteRedux.bps \
            rom.gba \
            EliteRedux.gba

          test -f EliteRedux.gba
          ls -lh EliteRedux.gba

      - name: Verify patched ROM
        run: |
          cmp pokeemerald_modern.gba EliteRedux.gba

          echo "Patched ROM matches compiled ROM."

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-diagnostic
          path: legendary_sage_diagnostic.txt
          if-no-files-found: warn

      - name: Upload patch and patched ROM
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-build
          path: |
            EliteRedux.bps
            EliteRedux.gba
          if-no-files-found: error
