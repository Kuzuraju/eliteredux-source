name: CompileEliteRedux

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: false
          depth: 1

      - name: Install Toolchain Minimal
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip git build-essential

      - name: Fetch and Extract Poryscript Native
        run: |
          mkdir -p tools
          wget "https://github.com" -O tools/poryscript.zip
          cd tools
          unzip poryscript.zip
          mv poryscript-linux poryscript || true
          chmod +x poryscript || true
          rm -f poryscript.zip
          cd ..

      - name: Install AGBCC Compiler
        run: |
          cd tools
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../..
          cd ../..

      - name: Build Native Tools
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Compile Custom ROM
        run: |
          make -j$(nproc) MODERN=1

      - name: Upload Finished GBA File
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-v265-Débridé
          path: "*.gba"
