
name: ManualBuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0

    steps:
      - name: Checkout EliteRedux
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            libpng-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            unzip \
            wget \
            openjdk-17-jdk

      - name: Download Poryscript
        run: |
          cd tools
          rm -rf poryscript-linux poryscript.zip poryscript
          wget -O poryscript.zip \
            https://github.com/huderlem/poryscript/releases/download/3.3.0/poryscript-linux.zip
          unzip -o poryscript.zip
          rm poryscript.zip
          mv poryscript-linux poryscript
          chmod +x poryscript/poryscript

      - name: Build agbcc
        working-directory: agbcc
        run: |
          ./build.sh

      - name: Checkout vanilla pokeemerald
        run: |
          git clone https://github.com/pret/pokeemerald.git vanilla-pokeemerald

      - name: Install agbcc into vanilla pokeemerald
        working-directory: agbcc
        run: |
          ./install.sh ../vanilla-pokeemerald

      - name: Build vanilla pokeemerald
        working-directory: vanilla-pokeemerald
        run: |
          make -j"$(nproc)"

      - name: Verify vanilla ROM
        run: |
          test -f vanilla-pokeemerald/pokeemerald.gba
          ls -lh vanilla-pokeemerald/pokeemerald.gba

      - name: Build EliteRedux
        run: |
          make -j"$(nproc)" all

      - name: Verify EliteRedux ROM
        run: |
          test -f pokeemerald.gba
          ls -lh pokeemerald.gba

      - name: Verify Flips
        run: |
          test -f flips-linux
          chmod +x flips-linux

      - name: Create BPS patch
        run: |
          ./flips-linux --create \
            vanilla-pokeemerald/pokeemerald.gba \
            pokeemerald.gba \
            EliteRedux.bps
          test -f EliteRedux.bps
          ls -lh EliteRedux.bps

      - name: Upload BPS file
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-patch
          path: EliteRedux.bps
          if-no-files-found: error
