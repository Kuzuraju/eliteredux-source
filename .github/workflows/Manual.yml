
name: ManualBuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0

    steps:
      - name: Checkout EliteRedux
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout proto files
        run: |
          rm -rf proto
          git clone --depth 1 --branch upcoming \
            https://github.com/Elite-Redux/er-config.git proto

          test -d proto
          find proto -type f \( -name '*.proto' -o -name '*.textproto' \) | head -20

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            libpng-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            unzip \
            wget \
            openjdk-17-jdk

      - name: Install modern Kotlin compiler
        run: |
          KOTLIN_VERSION=2.1.0

          wget -q \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -O "$RUNNER_TEMP/kotlin.zip"

          mkdir -p "$RUNNER_TEMP/kotlin"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"

          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" -version

      - name: Download Poryscript
        run: |
          cd tools

          rm -rf poryscript poryscript-linux poryscript-linux.zip

          wget -O poryscript-linux.zip \
            https://github.com/huderlem/poryscript/releases/download/3.5.2/poryscript-linux.zip

          unzip -o poryscript-linux.zip
          mv poryscript-linux poryscript

          rm poryscript-linux.zip
          cd ..

      - name: Fix compiler compatibility flags
        run: |
          sed -i 's/-std=gnu23/-std=gnu2x/g' Makefile
          sed -i 's/-Werror/-Werror -Wno-error=strict-aliasing/g' Makefile
          grep -nE 'gnu2x|Wno-error=strict-aliasing' Makefile

      - name: Build EliteRedux
        run: |
          make -j"$(nproc)"

      - name: Verify EliteRedux ROM
        run: |
          test -f pokeemerald_modern.gba
          ls -lh pokeemerald_modern.gba

      - name: Checkout vanilla pokeemerald
        run: |
          git clone https://github.com/pret/pokeemerald.git tools/pokeemerald

      - name: Build and install agbcc
        working-directory: tools
        run: |
          git clone https://github.com/pret/agbcc.git

          cd agbcc
          ./build.sh
          ./install.sh ../pokeemerald

      - name: Build vanilla pokeemerald
        working-directory: tools/pokeemerald
        run: |
          make -j"$(nproc)"

      - name: Verify vanilla ROM
        run: |
          test -f tools/pokeemerald/pokeemerald.gba
          ls -lh tools/pokeemerald/pokeemerald.gba

      - name: Create BPS patch
        run: |
          chmod +x ./flips-linux

          ./flips-linux --create \
            tools/pokeemerald/pokeemerald.gba \
            pokeemerald_modern.gba \
            EliteRedux.bps

          test -f EliteRedux.bps
          ls -lh EliteRedux.bps

      - name: Upload BPS file
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald_patch
          path: EliteRedux.bps
          if-no-files-found: error
