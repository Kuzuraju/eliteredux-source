name: ManualBuild

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
      GIT_CLONE_PROTECTION_ACTIVE: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Force Clean Ghost Submodules
        run: |
          rm -rf .gitmodules
          rm -rf tools/er-config
          rm -rf .git/modules

      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip

      - name: Setup Poryscript
        run: |
          mkdir -p tools
          cd tools
          wget https://github.com
          unzip poryscript-linux.zip
          mv poryscript-linux poryscript
          chmod +x poryscript

      - name: Precompile Tools
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Build ROM Hack
        run: make -j$(nproc)

      - name: Upload Finished ROM
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-Custom
          path: "*.gba"
