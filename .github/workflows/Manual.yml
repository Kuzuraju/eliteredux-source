name: CompileEliteRedux

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Repository Files Directly
        run: |
          wget https://github.com{{ github.repository }}/archive/refs/heads/upcoming.zip -O repo.zip
          unzip repo.zip
          mv eliteredux-source-upcoming/* ./ 2>/dev/null || mv mon-elite-redux-upcoming/* ./ 2>/dev/null || mv *upcoming/* ./ 2>/dev/null
          rm -f repo.zip

      - name: Install Toolchain Minimal
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip git build-essential

      - name: Setup Poryscript Linux Native
        run: |
          mkdir -p tools
          cd tools
          wget "https://github.com" -O poryscript.zip
          unzip poryscript.zip
          mv poryscript-linux poryscript
          chmod +x poryscript
          cd ..

      - name: Install AGBCC Compiler
        run: |
          cd tools
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../..
          cd ../..

      - name: Build Native Tools
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Compile Custom ROM
        run: |
          make -j$(nproc) MODERN=1

      - name: Upload Finished GBA File
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-v265-Débridé
          path: "*.gba"
