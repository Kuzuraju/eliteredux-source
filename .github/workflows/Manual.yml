name: ManualBuild

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Minimal Code
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          depth: 1

      - name: Free Disk Space & Purge Git Logs
        run: |
          rm -rf .git
          rm -rf .github
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Compiler Toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip build-essential

      - name: Inject Precompiled Poryscript
        run: |
          mkdir -p tools
          cd tools
          wget https://github.com
          unzip poryscript-linux.zip
          mv poryscript-linux poryscript
          chmod +x poryscript
          cd ..

      - name: Build Internal Tools Native
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Compile Custom ROM
        run: |
          make -j$(nproc) MODERN=1

      - name: Upload Finished GBA File
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-MyVersion
          path: "*.gba"
