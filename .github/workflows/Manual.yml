
name: ManualBuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0

    steps:
      - name: Checkout EliteRedux
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            libpng-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            unzip \
            wget

      - name: Download Poryscript
  run: |
    cd tools
    rm -rf poryscript-linux poryscript poryscript.zip
    wget -O poryscript.zip https://github.com/huderlem/poryscript/releases/download/3.3.0/poryscript-linux.zip
    unzip -o poryscript.zip
    mv poryscript-linux poryscript
    rm poryscript.zip

      - name: Build agbcc
        working-directory: agbcc
        run: ./build.sh

      - name: Checkout vanilla pokeemerald
        run: |
          git clone https://github.com/pret/pokeemerald.git tools/pokeemerald

      - name: Install agbcc into vanilla pokeemerald
        run: ./agbcc/install.sh tools/pokeemerald

      - name: Build EliteRedux
        run: make -j"$(nproc)" all

      - name: Build vanilla pokeemerald
        working-directory: tools/pokeemerald
        run: make -j"$(nproc)"

      - name: Verify ROM files
        run: |
          ls -lh pokeemerald.gba
          ls -lh tools/pokeemerald/pokeemerald.gba
          ls -lh flips-linux

      - name: Create BPS patch
        run: |
          chmod +x ./flips-linux
          ./flips-linux --create \
            tools/pokeemerald/pokeemerald.gba \
            pokeemerald.gba \
            EliteRedux.bps

      - name: Upload BPS patch
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald_patch
          path: EliteRedux.bps
