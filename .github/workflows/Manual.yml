name: ManualBuild

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 1
      COMPARE: 0
    steps:
      - name: Download Raw Workspace (Bypass Git Index)
        run: |
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://github.com{{ github.repository }}/archive/refs/heads/upcoming.zip -o repo.zip
          unzip repo.zip
          mv eliteredux-source-upcoming/* ./ 2>/dev/null || mv mon-elite-redux-upcoming/* ./ 2>/dev/null || mv *upcoming/* ./ 2>/dev/null
          rm -f repo.zip

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Compiler Toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip build-essential

      - name: Inject Precompiled Poryscript
        run: |
          mkdir -p tools
          cd tools
          wget https://github.com
          unzip poryscript-linux.zip
          mv poryscript-linux poryscript
          chmod +x poryscript
          cd ..

      - name: Build Internal Tools Native
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Compile Custom ROM
        run: |
          make -j$(nproc) MODERN=1

      - name: Upload Finished GBA File
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-MyVersion
          path: "*.gba"
