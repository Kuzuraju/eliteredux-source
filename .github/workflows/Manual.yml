name: CompileEliteRedux

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          depth: 1

      - name: Install Toolchain Minimal
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip build-essential

      - name: Inject Precompiled Poryscript
        run: |
          mkdir -p tools
          cd tools
          wget https://github.com
          unzip poryscript-linux.zip
          mv poryscript-linux poryscript
          chmod +x poryscript
          cd ..

      - name: Build Native Compilers
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Light C Compilation
        run: |
          make -j2 MODERN=1

      - name: Upload Finished GBA File
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-265-Custom
          path: "*.gba"
