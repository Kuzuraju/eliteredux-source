name: ManualBuild

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Minimal Code
        uses: actions/checkout@v4
        with:
          submodules: false
          depth: 1

      - name: Create Linux Memory Swap (Anti-OOM)
        run: |
          sudo swapoff -a
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Compiler Toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip build-essential

      - name: Inject Precompiled Poryscript
        run: |
          mkdir -p tools
          cd tools
          wget https://github.com
          unzip poryscript-linux.zip
          mv poryscript-linux poryscript
          chmod +x poryscript
          cd ..

      - name: Build Internal Tools Native
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Safe Memory Compilation
        run: |
          make -j2 MODERN=1

      - name: Upload Finished GBA File
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-MyVersion
          path: "*.gba"
