name: ManualBuild

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Download Repository Files Directly
        run: |
          wget https://github.com{{ github.repository }}/archive/refs/heads/upcoming.zip -O repo.zip
          unzip repo.zip
          mv eliteredux-source-upcoming/* ./
          rm -rf eliteredux-source-upcoming repo.zip .git

      - name: Create Artificial Base ROM
        run: |
          dd if=/dev/zero of=rom.gba bs=1M count=16

      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip git build-essential

      - name: Setup Poryscript
        run: |
          mkdir -p tools
          cd tools
          wget https://github.com
          unzip poryscript-linux.zip
          mv poryscript-linux poryscript
          chmod +x poryscript
          cd ..

      - name: Install AGBCC Compiler
        run: |
          cd tools
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../..
          cd ../..

      - name: Precompile Tools
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Build ROM Hack
        run: make -j$(nproc)

      - name: Upload Finished ROM
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-Custom
          path: "*.gba"
