name: ManualBuild

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout Code Without Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'false'
          set-safe-directory: 'true'
          persist-credentials: false

      - name: Force Purge Submodule Pointers
        run: |
          git rm --cached -r tools/er-config || true
          git rm --cached -r eliteredux-darky || true
          rm -rf .gitmodules

      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev wget unzip

      - name: Setup Poryscript
        run: |
          mkdir -p tools
          cd tools
          wget https://github.com
          unzip poryscript-linux.zip
          mv poryscript-linux poryscript
          chmod +x poryscript

      - name: Precompile Tools
        run: |
          make -C tools/preproc
          make -C tools/gbagfx
          make -C tools/scaninc

      - name: Build ROM Hack
        run: make -j$(nproc)

      - name: Upload Finished ROM
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-Custom
          path: "*.gba"
