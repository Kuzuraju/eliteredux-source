
name: Trainer Randomizer Diagnostic

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Elite Redux
        uses: actions/checkout@v4
        with:
          ref: upcoming
          submodules: false

      - name: Extract relevant source code
        run: |
          mkdir -p trainer-diagnostic

          python3 - <<'PY'
          from pathlib import Path
          import re

          output = Path("trainer-diagnostic/report.txt")

          targets = {
              "src/pokemon.c": [
                  "selectMoves",
                  "GetRandomPokemonFromSpecies",
                  "IsSpeciesRandomizerAllowed",
                  "GetRandomSpeciesFromPool",
              ],
              "src/ui_intro_options.c": [
                  "SETTING_RANDOMIZER_MODE",
                  "SETTING_RANDOMIZER_TYPE_MODE",
              ],
              "include/global.h": [
                  "encounterRandomizedMode",
                  "struct SaveBlock2",
              ],
              "include/constants/vars.h": [
                  "VAR_RANDOMIZED_SEED",
              ],
              "src/battle_main.c": [
                  "CreateNPCTrainerParty",
              ],
          }

          with output.open("w") as report:
              for filename, terms in targets.items():
                  path = Path(filename)

                  report.write(f"\n=== {filename} ===\n")

                  if not path.exists():
                      report.write("FILE NOT FOUND\n")
                      continue

                  lines = path.read_text(
                      errors="replace"
                  ).splitlines()

                  matches = [
                      i for i, line in enumerate(lines)
                      if any(term in line for term in terms)
                  ]

                  intervals = []
                  for i in matches:
                      start = max(0, i - 12)
                      end = min(len(lines), i + 45)
                      intervals.append((start, end))

                  intervals.sort()
                  merged = []

                  for start, end in intervals:
                      if merged and start <= merged[-1][1]:
                          merged[-1] = (
                              merged[-1][0],
                              max(merged[-1][1], end)
                          )
                      else:
                          merged.append((start, end))

                  for start, end in merged:
                      report.write(
                          f"\n--- Lines {start+1}-{end} ---\n"
                      )

                      for i in range(start, end):
                          report.write(
                              f"{i+1}: {lines[i]}\n"
                          )

          print(f"Report created: {output}")
          PY

      - name: Find trainer classifications
        run: |
          {
            echo
            echo "=== TRAINER CLASSES AND IDENTIFIERS ==="

            grep -RniE \
              'TRAINER_CLASS_LEADER|TRAINER_CLASS_ELITE_FOUR|TRAINER_CLASS_CHAMPION|TRAINER_ROXANNE|TRAINER_BRAWLY|TRAINER_WATTSON|TRAINER_FLANNERY|TRAINER_NORMAN|TRAINER_WINONA|TRAINER_TATE|TRAINER_LIZA|TRAINER_WALLACE' \
              include src \
              --include='*.h' \
              --include='*.c' \
              2>/dev/null | head -250 || true

            echo
            echo "=== TRAINER DATA FILES ==="

            find . \
              -type f \
              \( -iname '*trainer*' \
              -o -iname '*trainer_class*' \) \
              -not -path './.git/*' \
              | sort | head -120

          } >> trainer-diagnostic/report.txt

      - name: Find save structure and options
        run: |
          {
            echo
            echo "=== SAVE AND OPTION REFERENCES ==="

            grep -RniE \
              'struct SaveBlock2|sizeof\(struct SaveBlock2\)|SETTING_RANDOMIZER_MODE|VAR_RANDOMIZED_SEED|RandRangeDeterministic' \
              include src \
              --include='*.c' \
              --include='*.h' \
              2>/dev/null | head -250 || true

          } >> trainer-diagnostic/report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Randomizer-Source-Report
          path: trainer-diagnostic/report.txt
          if-no-files-found: error
