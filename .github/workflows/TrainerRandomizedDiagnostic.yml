
name: Trainer Randomizer Final Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download source without submodules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/zipball/upcoming" \
            -o source.zip

          mkdir -p source

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile("source.zip") as z:
              z.extractall("source")

          roots = [p for p in Path("source").iterdir()
                   if p.is_dir()]
          if len(roots) != 1:
              raise RuntimeError("Unexpected archive structure")

          for p in roots[0].iterdir():
              p.rename(Path("source") / p.name)
          roots[0].rmdir()
          PY

          test -f source/src/battle_main.c
          test -f source/src/pokemon.c

      - name: Extract required implementation details
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p trainer-inspection

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source")
          output = Path("trainer-inspection/report.txt")

          targets = {
              "src/battle_main.c": [
                  ("selectMoves", 120),
                  ("CreateNPCTrainerParty", 210),
              ],
              "src/ui_intro_options.c": [
                  ("SaveOptionsData", 85),
                  ("LoadOptionsData", 85),
              ],
              "src/pokemon.c": [
                  ("GetAbilityBySpecies", 45),
                  ("GetInnateInSlot", 65),
              ],
          }

          with output.open("w", encoding="utf-8") as out:
              out.write("TRAINER RANDOMIZER FINAL INSPECTION\n\n")

              for filename, functions in targets.items():
                  path = root / filename
                  out.write(f"\n===== {filename} =====\n")

                  lines = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  ).splitlines()

                  for name, count in functions:
                      out.write(f"\n--- {name} ---\n")

                      pattern = re.compile(
                          r"^\s*(?:static\s+)?"
                          r"(?:inline\s+)?"
                          r"[\w\s\*]+\b"
                          + re.escape(name)
                          + r"\s*\("
                      )

                      matches = [
                          i for i, line in enumerate(lines)
                          if pattern.search(line)
                      ]

                      if not matches:
                          out.write("Definition not found here\n")
                          continue

                      for start in matches[:2]:
                          end = min(len(lines), start + count)
                          for i in range(start, end):
                              out.write(f"{i+1}: {lines[i]}\n")

              out.write("\n===== SPECIES FILTER =====\n")

              matches = []
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix not in (".c", ".h"):
                      continue
                  if any(part in ("tools", ".git")
                         for part in path.parts):
                      continue

                  try:
                      lines = path.read_text(
                          encoding="utf-8",
                          errors="replace"
                      ).splitlines()
                  except OSError:
                      continue

                  pattern = re.compile(
                      r"^\s*(?:static\s+)?"
                      r"(?:inline\s+)?"
                      r"[\w\s\*]+\b"
                      r"IsSpeciesRandomizerAllowed\s*\("
                  )

                  for i, line in enumerate(lines):
                      if pattern.search(line):
                          matches.append((path, i, lines))

              for path, start, lines in matches[:5]:
                  out.write(f"\n--- {path}:{start+1} ---\n")
                  for i in range(start, min(len(lines), start+100)):
                      out.write(f"{i+1}: {lines[i]}\n")

              out.write("\n===== SAVE BLOCK FLAGS =====\n")
              path = root / "include/global.h"
              lines = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines()

              for i, line in enumerate(lines):
                  if "struct SaveBlock2" in line:
                      for j in range(i, min(i+110, len(lines))):
                          out.write(f"{j+1}: {lines[j]}\n")
                      break

              out.write("\n===== MENU OPTIONS =====\n")
              path = root / "src/ui_intro_options.c"
              lines = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines()

              for start, end in [(40, 90), (510, 610)]:
                  for i in range(start, min(end, len(lines))):
                      out.write(f"{i+1}: {lines[i]}\n")

              out.write("\n===== SEED INITIALIZATION =====\n")
              for path in (root/"src").rglob("*.c"):
                  lines = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  ).splitlines()

                  for i, line in enumerate(lines):
                      if "VAR_RANDOMIZED_SEED" in line:
                          out.write(
                              f"{path.relative_to(root)}:"
                              f"{i+1}: {line}\n"
                          )

          print("Inspection report generated.")
          PY

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Randomizer-Final-Inspection
          path: trainer-inspection/report.txt
          if-no-files-found: error
          retention-days: 7
