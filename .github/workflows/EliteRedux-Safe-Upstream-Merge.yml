
name: Elite Redux - Safe Upstream Merge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TARGET_BRANCH: upstream-update-test-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Fetch source repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work report
          cd work

          git init -q

          git remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          git remote add upstream \
            "https://github.com/Elite-Redux/eliteredux-source.git"

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            fetch --no-tags origin \
            +refs/heads/upcoming:refs/remotes/origin/upcoming

          git fetch --no-tags upstream \
            +refs/heads/upcoming:refs/remotes/upstream/upcoming

          git checkout -q -b "$TARGET_BRANCH" \
            refs/remotes/origin/upcoming

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git rev-parse origin/upcoming \
            > ../report/local-commit.txt

          git rev-parse upstream/upcoming \
            > ../report/upstream-commit.txt

          git merge-base origin/upcoming upstream/upcoming \
            > ../report/merge-base.txt

      - name: Squash upstream changes safely
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          cd work

          echo "Starting squash merge..."

          if git merge --squash upstream/upcoming \
            > ../report/merge-output.txt 2>&1; then
            MERGE_STATUS=0
          else
            MERGE_STATUS=$?
          fi

          echo "$MERGE_STATUS" \
            > ../report/merge-exit-code.txt

          git diff --name-only --diff-filter=U \
            > ../report/initial-conflicts.txt

          echo "Restoring all local GitHub workflows..."

          # Keep every local workflow exactly as it was.
          # This also removes new upstream workflows.
          git restore \
            --source=origin/upcoming \
            --staged \
            --worktree \
            -- .github/workflows/

          git diff --name-only --diff-filter=U \
            > ../report/remaining-conflicts.txt

          git status --short \
            > ../report/status-after-resolution.txt

          if [ -s ../report/remaining-conflicts.txt ]; then
            echo "Non-workflow conflicts remain. No push." \
              | tee ../report/result.txt
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Verifying local workflows..."

          OLD_WORKFLOWS=$(git rev-parse \
            origin/upcoming:.github/workflows)

          NEW_WORKFLOWS=$(git rev-parse \
            :.github/workflows)

          if [ "$OLD_WORKFLOWS" != "$NEW_WORKFLOWS" ]; then
            echo "Workflow preservation failed. No push." \
              | tee ../report/result.txt
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "All local workflows preserved." \
            > ../report/workflow-verification.txt

          echo "Checking customized graphics..."

          BASE=$(git merge-base \
            origin/upcoming upstream/upcoming)

          git diff --name-only \
            "$BASE" origin/upcoming \
            -- graphics/pokemon \
            > ../report/local-graphics-changed.txt

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          paths = Path(
              '../report/local-graphics-changed.txt'
          ).read_text().splitlines()

          problems = []

          for path in paths:
              old = subprocess.run(
                  ['git', 'rev-parse',
                   f'origin/upcoming:{path}'],
                  capture_output=True,
                  text=True
              )
              new = subprocess.run(
                  ['git', 'rev-parse',
                   f':{path}'],
                  capture_output=True,
                  text=True
              )

              if old.returncode != new.returncode:
                  problems.append(path)
              elif old.returncode == 0:
                  if old.stdout.strip() != new.stdout.strip():
                      problems.append(path)

          Path(
              '../report/graphics-not-preserved.txt'
          ).write_text(
              '\n'.join(problems)
              + ('\n' if problems else '')
          )
          PY

          if [ -s ../report/graphics-not-preserved.txt ]; then
            echo "Customized graphics changed. No push." \
              | tee ../report/result.txt
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Customized graphics preserved." \
            > ../report/graphics-verification.txt

          git diff --cached --name-status \
            > ../report/staged-changes.txt

          if git diff --cached --quiet; then
            echo "No changes to publish." \
              | tee ../report/result.txt
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Squash merge ready for publication." \
            | tee ../report/result.txt

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish isolated test branch
        if: steps.merge.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd work

          git commit -m \
            "Update Elite Redux source from official upstream"

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            push origin \
            "HEAD:refs/heads/$TARGET_BRANCH"

          echo "Published branch: $TARGET_BRANCH" \
            >> ../report/result.txt

          echo "https://github.com/${GITHUB_REPOSITORY}/tree/${TARGET_BRANCH}" \
            > ../report/branch-url.txt

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EliteRedux-Safe-Merge-Report
          path: report/
          if-no-files-found: warn
