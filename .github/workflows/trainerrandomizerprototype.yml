name: Trainer Randomizer Prototype

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Download upcoming without submodules
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPOSITORY}/zipball/upcoming" -o source.zip
          mkdir source
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('source.zip') as z:
              z.extractall('source')
          roots = [p for p in Path('source').iterdir() if p.is_dir()]
          assert len(roots) == 1, 'Unexpected archive structure'
          for p in list(roots[0].iterdir()):
              p.rename(Path('source') / p.name)
          roots[0].rmdir()
          PY

      - name: Patch sources with guarded transformations
        run: |
          set -euo pipefail
          cat > patch.py <<'PY'
          from pathlib import Path
          import re

          root = Path('source')
          def load(p): return (root / p).read_text(encoding='utf-8')
          def save(p, s): (root / p).write_text(s, encoding='utf-8')
          def sub1(s, pattern, replacement, label, flags=0):
              matches = list(re.finditer(pattern, s, flags))
              if len(matches) != 1:
                  raise RuntimeError(f'{label}: expected one match, got {len(matches)}')
              m = matches[0]
              return s[:m.start()] + replacement + s[m.end():]
          def block(s, start_pattern, label):
              matches = list(re.finditer(start_pattern, s, re.S))
              if len(matches) != 1:
                  raise RuntimeError(f'{label}: expected one definition, got {len(matches)}')
              m = matches[0]
              opening = s.index('{', m.start())
              depth = 0
              for i in range(opening, len(s)):
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0: return m.start(), i+1
              raise RuntimeError(f'{label}: unmatched braces')

          # Save bit: change only the spare two-bit field in SaveBlock2.
          p = 'include/global.h'
          s = load(p)
          start = s.index('struct SaveBlock2 {')
          end = s.index('};', start)
          section = s[start:end]
          section = sub1(section, r'\bu8\s+filler\s*:\s*2\s*;',
                         'u8 trainerRandomizedMode:1;\n    u8 filler:1;', 'SaveBlock2 spare bit')
          save(p, s[:start] + section + s[end:])

          # Menu enum, table, save and load; scope the table insertion.
          p = 'src/ui_intro_options.c'
          s = load(p)
          s = sub1(s, r'(?m)^([ \t]*)SETTING_RANDOMIZER_ABILITY_MODE,',
                   '    SETTING_TRAINER_RANDOMIZER_MODE,\n    SETTING_RANDOMIZER_ABILITY_MODE,', 'Menu enum')
          table_match = re.search(r'(?m)^\s*\[SETTING_RANDOMIZER_MODE\]\s*=', s)
          if not table_match: raise RuntimeError('Options table not found')
          table_end = s.find('[SETTING_RANDOMIZER_INNATE_MODE] =', table_match.end())
          if table_end < 0: raise RuntimeError('Options table boundary not found')
          a, b = table_match.start(), table_end
          table = s[a:b]
          entry = '''    [SETTING_TRAINER_RANDOMIZER_MODE] =
              {
                  .title = _("Trainer Randomizer"),
                  .options = { _("Disabled"), _("Enabled") },
                  .optionDescription = {
                      _("Keep the original trainer teams."),
                      _("Randomize trainer species with a fixed seed.")
                  },
                  .numOptions = 2,
              },
          '''
          table = sub1(table, r'(?m)^\s*\[SETTING_RANDOMIZER_ABILITY_MODE\]\s*=',
                       '\n' + entry + '    [SETTING_RANDOMIZER_ABILITY_MODE] =', 'Menu entry')
          s = s[:a] + table + s[b:]
          a, b = block(s, r'static\s+void\s+SaveOptionsData\s*\(\s*\)\s*\{', 'SaveOptionsData')
          sec = s[a:b]
          insert = '''gSaveBlock2Ptr->trainerRandomizedMode = sMenuDataPtr->temporal_settings[SETTING_TRAINER_RANDOMIZER_MODE];
              if (gSaveBlock2Ptr->trainerRandomizedMode && VarGet(VAR_RANDOMIZED_SEED) == 0) {
                  u16 trainerSeed = Random();
                  VarSet(VAR_RANDOMIZED_SEED, trainerSeed ? trainerSeed : 1);
              }
              '''
          sec = sub1(sec, r'gSaveBlock2Ptr->innaterandomizedMode\s*=', insert + 'gSaveBlock2Ptr->innaterandomizedMode =', 'Save setting')
          s = s[:a] + sec + s[b:]
          a, b = block(s, r'static\s+void\s+LoadOptionsData\s*\(\s*\)\s*\{', 'LoadOptionsData')
          sec = s[a:b]
          sec = sub1(sec, r'sMenuDataPtr->temporal_settings\[SETTING_RANDOMIZER_INNATE_MODE\]\s*=',
                     'sMenuDataPtr->temporal_settings[SETTING_TRAINER_RANDOMIZER_MODE] = gSaveBlock2Ptr->trainerRandomizedMode;\n    sMenuDataPtr->temporal_settings[SETTING_RANDOMIZER_INNATE_MODE] =', 'Load setting')
          s = s[:a] + sec + s[b:]
          save(p, s)

          # Battle function. Leave OLDPLAYER special case intact.
          p = 'src/battle_main.c'
          s = load(p)
          a, b = block(s, r'static\s+u8\s+CreateNPCTrainerParty\s*\([^;{}]*\)\s*\{', 'CreateNPCTrainerParty')
          sec = s[a:b]
          original = re.compile(r'if\s*\(\s*trainerNum\s*==\s*TRAINER_OLDPLAYER\s*\)\s*\{\s*species\s*=\s*Random\(\)\s*%\s*500\s*;\s*CreateMon\s*\(\s*&party\[i\]\s*,\s*species\s*,[^;]*;\s*\}\s*else\s*CreateMon\s*\(\s*&party\[i\]\s*,\s*partyData\[i\]\.species\s*,[^;]*;', re.S)
          m = original.search(sec)
          if not m or len(original.findall(sec)) != 1: raise RuntimeError('Trainer CreateMon block not uniquely found')
          old = m.group()
          oldplayer_call = re.search(r'CreateMon\s*\(\s*&party\[i\]\s*,\s*species\s*,[^;]*;', old, re.S).group()
          normal_call = re.search(r'CreateMon\s*\(\s*&party\[i\]\s*,\s*partyData\[i\]\.species\s*,[^;]*;', old, re.S).group()
          normal_call = normal_call.replace('partyData[i].species', 'species', 1)
          replacement = '''prototypeRandomized = FALSE;
              if (trainerNum == TRAINER_OLDPLAYER) {
                  species = Random() % 500;
                  OLDPLAYER_CALL
              } else {
                  species = partyData[i].species;
                  if (gSaveBlock2Ptr->trainerRandomizedMode) {
                      species = GetPrototypeTrainerSpecies(trainerNum, i, gSaveBlock2Ptr->gameDifficulty, species);
                      prototypeRandomized = (species != partyData[i].species);
                  }
                  NORMAL_CALL
              }'''.replace('OLDPLAYER_CALL', oldplayer_call).replace('NORMAL_CALL', normal_call)
          sec = sec[:m.start()] + replacement + sec[m.end():]
          # Put declaration directly after the opening brace (C99 declarations allowed).
          opening = sec.index('{')
          sec = sec[:opening+1] + '\n    bool8 prototypeRandomized = FALSE;\n' + sec[opening+1:]
          sec = sub1(sec, r'SetMonData\s*\(\s*&party\[i\]\s*,\s*MON_DATA_ABILITY_NUM\s*,\s*&partyData\[i\]\.ability\s*\)\s*;',
                     'if (!prototypeRandomized) SetMonData(&party[i], MON_DATA_ABILITY_NUM, &partyData[i].ability);', 'Ability override')
          sec = sub1(sec, r'SetMonData\s*\(\s*&party\[i\]\s*,\s*MON_DATA_HELD_ITEM\s*,\s*&partyData\[i\]\.heldItem\s*\)\s*;',
                     'if (!prototypeRandomized) SetMonData(&party[i], MON_DATA_HELD_ITEM, &partyData[i].heldItem);', 'Held item override')
          # Reuse existing OLDPLAYER selectMoves branch for randomized species.
          sec = sub1(sec, r'if\s*\(\s*trainerNum\s*==\s*TRAINER_OLDPLAYER\s*\)\s*\{(?=\s*for\s*\(\s*j\s*=\s*0\s*;\s*j\s*<\s*MAX_MON_MOVES)',
                     'if (trainerNum == TRAINER_OLDPLAYER || prototypeRandomized) {', 'Moveset generation')
          helper = '''// Deterministic per trainer, slot and difficulty; never consumes battle RNG.
          static SpeciesEnum GetPrototypeTrainerSpecies(u16 trainerNum, u8 slot, u8 difficulty, SpeciesEnum original)
          {
              u32 seed = VarGet(VAR_RANDOMIZED_SEED);
              u16 attempt;
              if (!seed) return original;
              seed ^= (u32)trainerNum * 0x9E3779B9u;
              seed ^= (u32)(slot + 1) * 0x85EBCA6Bu;
              seed ^= (u32)(difficulty + 1) * 0xC2B2AE35u;
              if (!seed) seed = 1;
              for (attempt = 0; attempt < 512; attempt++) {
                  SpeciesEnum candidate = RandRangeDeterministic(1, REAL_SPECIES_COUNT - 1, &seed);
                  if (IsSpeciesRandomizerAllowed(candidate, FALSE, TRUE)) return candidate;
              }
              return original;
          }

          '''
          s = s[:a] + helper + sec + s[b:]
          save(p, s)
          print('Patched SaveBlock2, intro options and trainer party creation.')
          PY
          python3 patch.py

      - name: Publish as an atomic commit on a new branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > publish.py <<'PY'
          import os, json, base64, urllib.request, urllib.error
          from pathlib import Path
          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          branch = 'trainer-randomizer-test'
          def api(method, endpoint, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + endpoint, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          try:
              api('GET', '/git/ref/heads/' + branch)
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
          else:
              raise RuntimeError(f'{branch} already exists; refusing to overwrite it')
          parent = api('GET', '/git/ref/heads/upcoming')['object']['sha']
          tree_sha = api('GET', '/git/commits/' + parent)['tree']['sha']
          entries = []
          for path in ['include/global.h', 'src/ui_intro_options.c', 'src/battle_main.c']:
              content = base64.b64encode(Path('source', path).read_bytes()).decode()
              blob = api('POST', '/git/blobs', {'content': content, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api('POST', '/git/trees', {'base_tree': tree_sha, 'tree': entries})
          commit = api('POST', '/git/commits', {'message': 'Experimental trainer randomizer', 'tree': tree['sha'], 'parents': [parent]})
          api('POST', '/git/refs', {'ref': 'refs/heads/' + branch, 'sha': commit['sha']})
          print('Created', branch, 'at', commit['sha'])
          PY
          python3 publish.py

      - name: Upload patched files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-randomizer-prototype-files
          path: |
            source/include/global.h
            source/src/ui_intro_options.c
            source/src/battle_main.c
          retention-days: 7
