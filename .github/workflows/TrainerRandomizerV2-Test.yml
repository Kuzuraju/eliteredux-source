      - name: Adjust compiler flags
        run: |
          set -euo pipefail
          cd work

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Makefile")
          source = path.read_text()

          source = source.replace(
              "-std=gnu23",
