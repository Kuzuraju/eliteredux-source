name: Trainer Randomizer V2 - Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
      DEBIAN_FRONTEND: noninteractive

    defaults:
      run:
        shell: bash

    steps:
      - name: Fetch pinned source and apply trainer randomizer fix
        run: |
          set -euo pipefail
          mkdir -p work report
          cd work
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 --no-tags origin 35a5b95e4cada1294efeebe9c51bfa4b63fc5bd3
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 35a5b95e4cada1294efeebe9c51bfa4b63fc5bd3
          git rev-parse HEAD | tee ../report/source-commit.txt

          cat > ../report/trainer-randomizer.patch <<'TRAINER_PATCH'
          diff --git a/include/new_game.h b/include/new_game.h
          index 9b96ba47..a8150bb5 100644
          --- a/include/new_game.h
          +++ b/include/new_game.h
          @@ -10,6 +10,7 @@ void SetTrainerId(u32 trainerId, u8 *dst);
           u32 GetTrainerId(u8 *trainerId);
           void CopyTrainerId(u8 *dst, u8 *src);
           void NewGameInitData(void);
          +u16 GetOrInitTrainerRandomizerSeed(void);
           void ResetMenuAndMonGlobals(void);
           void Sav2_ClearSetDefault(void);
           
          diff --git a/include/pokemon.h b/include/pokemon.h
          index 0fb63cc7..93e37ad3 100644
          --- a/include/pokemon.h
          +++ b/include/pokemon.h
          @@ -433,6 +433,7 @@ u8 CalculatePlayerBattlerPartyCount(void);
           u8 GetMonsStateToDoubles(void);
           u8 GetMonsStateToDoubles_2(void);
           u16 GetAbilityBySpecies(SpeciesEnum species, u8 abilityNum);
          +bool8 TrainerRandomizerSpeciesAllowed(SpeciesEnum species);
           u16 GetMonAbility(struct Pokemon* mon);
           void CreateSecretBaseEnemyParty(struct SecretBase* secretBaseRecord);
           u8 GetSecretBaseTrainerPicIndex(void);
          diff --git a/src/battle_main.c b/src/battle_main.c
          index 3768b301..286bcbb6 100644
          --- a/src/battle_main.c
          +++ b/src/battle_main.c
          @@ -22,6 +22,7 @@
           #include "generated/constants/battle_move_effects.h"
           #include "constants/battle_string_ids.h"
           #include "constants/hold_effects.h"
          +#include "constants/flags.h"
           #include "constants/items.h"
           #include "generated/constants/moves.h"
           #include "constants/opponents.h"
          @@ -48,6 +49,7 @@
           #include "m4a.h"
           #include "main.h"
           #include "malloc.h"
          +#include "new_game.h"
           #include "mgba_printf/mgba.h"
           #include "mgba_printf/mini_printf.h"
           #include "palette.h"
          @@ -1726,26 +1728,449 @@ static void sub_8038538(struct Sprite* sprite) {
               }
           }
           
          -// Deterministic per trainer, slot and difficulty; never consumes battle RNG.
          -static SpeciesEnum GetPrototypeTrainerSpecies(u16 trainerNum, u8 slot, u8 difficulty, SpeciesEnum original)
          +enum TrainerEvolutionStage {
          +    TRAINER_STAGE_UNEVOLVING = 0,
          +    TRAINER_STAGE_FIRST = 1,
          +    TRAINER_STAGE_FINAL = 2,
          +    TRAINER_STAGE_MIDDLE = 3,
          +};
          +
          +static u8 *AllocTrainerEvolutionStages(void)
          +{
          +    // Two bits per species, allocated only while constructing the trainer party.
          +    u8 *stages = AllocZero((REAL_SPECIES_COUNT + 3) / 4);
          +    if (stages == NULL)
          +        return NULL;
          +
          +    for (u16 species = 1; species < REAL_SPECIES_COUNT; species++) {
          +        const struct Evolution *evolutions = gEvolutionTable[species];
          +        if (evolutions == NULL)
          +            continue;
          +
          +        for (u16 i = 0; evolutions[i].method != 0; i++) {
          +            SpeciesEnum target = evolutions[i].targetSpecies;
          +            if (evolutions[i].method == EVO_DEEVOLUTION || target <= SPECIES_NONE
          +                || target >= REAL_SPECIES_COUNT || target == species)
          +                continue;
          +
          +            stages[species / 4] |= TRAINER_STAGE_FIRST << (2 * (species % 4));
          +            stages[target / 4] |= TRAINER_STAGE_FINAL << (2 * (target % 4));
          +        }
          +    }
          +    return stages;
          +}
          +
          +static u16 GetTrainerSpeciesBaseStatTotal(SpeciesEnum species)
          +{
          +    const struct BaseStats *stats = &gBaseStats[species];
          +    return stats->baseHP + stats->baseAttack + stats->baseDefense
          +         + stats->baseSpeed + stats->baseSpAttack + stats->baseSpDefense;
          +}
          +
          +// Rank a deterministic sample so evolution stage is a preference, with power as a second signal.
          +static SpeciesEnum GetPrototypeTrainerSpecies(u16 trainerNum, u8 slot, u8 difficulty, SpeciesEnum original, u8 level, const u8 *stages)
           {
          -    u32 seed = VarGet(VAR_RANDOMIZED_SEED);
          -    u16 attempt;
          -    if (!seed) return original;
          +    u8 preferredStage = level < 18 ? TRAINER_STAGE_FIRST
          +                      : level < 36 ? TRAINER_STAGE_MIDDLE : TRAINER_STAGE_FINAL;
          +    s32 typicalPower = level < 18 ? 315 : level < 36 ? 410 : 510;
          +    s32 originalPower = GetTrainerSpeciesBaseStatTotal(original);
          +    if (originalPower < typicalPower - 30)
          +        originalPower = typicalPower - 30;
          +    if (originalPower > typicalPower + 30)
          +        originalPower = typicalPower + 30;
          +
          +    u32 seed = GetOrInitTrainerRandomizerSeed();
               seed ^= (u32)trainerNum * 0x9E3779B9u;
               seed ^= (u32)(slot + 1) * 0x85EBCA6Bu;
               seed ^= (u32)(difficulty + 1) * 0xC2B2AE35u;
               if (!seed) seed = 1;
          -    for (attempt = 0; attempt < 512; attempt++) {
          +
          +    SpeciesEnum bestSpecies = original;
          +    s32 bestScore = 32767;
          +    u8 eligible = 0;
          +    for (u16 attempt = 0; attempt < 512 && eligible < 32; attempt++) {
                   SpeciesEnum candidate = RandRangeDeterministic(1, REAL_SPECIES_COUNT - 1, &seed);
          -        if (IsSpeciesRandomizerAllowed(candidate, FALSE, TRUE)) return candidate;
          +        if (candidate == original || !TrainerRandomizerSpeciesAllowed(candidate))
          +            continue;
          +
          +        eligible++;
          +        s32 statDifference = GetTrainerSpeciesBaseStatTotal(candidate) - originalPower;
          +        s32 score = statDifference < 0 ? -statDifference : statDifference;
          +        if (statDifference > 65)
          +            score += statDifference - 65;
          +        if (stages != NULL) {
          +            u8 stage = (stages[candidate / 4] >> (2 * (candidate % 4))) & 3;
          +            if (stage != TRAINER_STAGE_UNEVOLVING && stage != preferredStage)
          +                score += 45;
          +        }
          +
          +        // Leave room for variety among candidates of roughly comparable power.
          +        score += RandRangeDeterministic(0, 60, &seed);
          +        if (score < bestScore) {
          +            bestScore = score;
          +            bestSpecies = candidate;
          +        }
               }
          -    return original;
          +    return bestSpecies;
           }
           
          -static u8 CreateNPCTrainerParty(struct Pokemon* party, u16 trainerNum, bool8 firstTrainer) {
          -    bool8 prototypeRandomized = FALSE;
          +// Rank moves the species can learn for this battle.
          +static s32 ScoreTrainerMove(u16 move, SpeciesEnum species, u16 attack, u16 spAttack,
          +                            u32 seed, const u16 *selected, u8 count)
          +{
          +    const struct BattleMove *data = &gBattleMoves[move];
          +    bool8 status = data->split == SPLIT_STATUS;
          +    s32 score = (s32)((seed ^ ((u32)move * 0x9E3779B9u)) >> 28);
          +
          +    for (u8 i = 0; i < count; i++) {
          +        const struct BattleMove *previous = &gBattleMoves[selected[i]];
          +        if (move == selected[i])
          +            return -10000;
          +        if (status && previous->split == SPLIT_STATUS)
          +            score -= 100;
          +        if (!status && previous->split != SPLIT_STATUS && previous->type == data->type)
          +            score -= 75;
          +    }
          +
          +    if (status) {
          +        // Lead with an attack when the species has one.
          +        if (count == 0)
          +            return score - 500;
          +        switch (move) {
          +        case MOVE_SWORDS_DANCE:
          +            return score + (attack >= spAttack ? 125 : 20);
          +        case MOVE_NASTY_PLOT:
          +            return score + (spAttack >= attack ? 125 : 20);
          +        case MOVE_RECOVER:
          +        case MOVE_ROOST:
          +        case MOVE_SOFT_BOILED:
          +        case MOVE_SYNTHESIS:
          +        case MOVE_STRENGTH_SAP:
          +        case MOVE_STEALTH_ROCK:
          +        case MOVE_SPIKES:
          +        case MOVE_WILL_O_WISP:
          +        case MOVE_THUNDER_WAVE:
          +        case MOVE_LEECH_SEED:
          +            return score + 115;
          +        default:
          +            return score + 10;
          +        }
          +    }
          +
          +    u16 accuracy = data->accuracy == 0 ? 100 : data->accuracy;
          +    u16 offensiveStat = data->split == SPLIT_PHYSICAL ? attack : spAttack;
          +    u16 highestStat = attack > spAttack ? attack : spAttack;
          +    u16 power = data->power > 140 ? 140 : data->power;
          +
          +    score += 40 + (power * accuracy / 100) * offensiveStat / (highestStat ? highestStat : 1);
          +    if (data->type == gBaseStats[species].type1 || data->type == gBaseStats[species].type2)
          +        score += 40;
          +    if (data->twoTurnMove || data->everyOtherTurn)
          +        score -= 45;
          +    return score;
          +}
          +
          +static void SetCompetitiveTrainerMoves(struct Pokemon *mon, SpeciesEnum species, u16 trainerNum, u8 partySlot)
          +{
          +    _Static_assert(TUTOR_COUNT <= 256, "Tutor IDs must fit CanLearnTutorMove");
          +    u16 candidates[MAX_LEVEL_UP_MOVES + TUTOR_COUNT];
          +    u16 selected[MAX_MON_MOVES] = {0};
          +    u16 candidateCount = 0;
          +    u8 level = GetMonData(mon, MON_DATA_LEVEL, NULL);
          +    u8 ppBonuses = 0;
          +    u16 attack = GetMonData(mon, MON_DATA_ATK, NULL);
          +    u16 spAttack = GetMonData(mon, MON_DATA_SPATK, NULL);
          +    u32 seed = ((u32)VarGet(VAR_RANDOMIZED_SEED) << 16)
          +               ^ ((u32)trainerNum * 0x9E3779B9u) ^ ((u32)(partySlot + 1) * 0x85EBCA6Bu);
          +
          +    const struct LevelUpMove *learnset = gLevelUpLearnsets[species];
          +    for (u16 i = 0; i < MAX_LEVEL_UP_MOVES && learnset[i].move != LEVEL_UP_END; i++) {
          +        if (learnset[i].level <= level)
          +            candidates[candidateCount++] = learnset[i].move;
          +    }
          +
          +    for (u16 tutor = 0; tutor < TUTOR_COUNT; tutor++) {
          +        if (CanLearnTutorMove(species, tutor))
          +            candidates[candidateCount++] = GetTutorMove(tutor);
          +    }
          +
          +    for (u8 slot = 0; slot < MAX_MON_MOVES; slot++) {
          +        s32 bestScore = -10000;
          +        for (u16 i = 0; i < candidateCount; i++) {
          +            u16 move = candidates[i];
          +            if (move == MOVE_NONE || gBattleMoves[move].effect == EFFECT_PLACEHOLDER)
          +                continue;
          +            s32 score = ScoreTrainerMove(move, species, attack, spAttack, seed, selected, slot);
          +            if (score > bestScore) {
          +                bestScore = score;
          +                selected[slot] = move;
          +            }
          +        }
          +        if (selected[slot] == MOVE_NONE)
          +            break;
          +        ppBonuses |= gPPUpGetMask[slot];
          +    }
          +
          +    SetMonData(mon, MON_DATA_PP_BONUSES, &ppBonuses);
          +    for (u8 i = 0; i < MAX_MON_MOVES; i++) {
          +        u16 move = selected[i];
          +        u8 pp = move == MOVE_NONE ? 0 : CalculatePPWithBonus(move, ppBonuses, i);
          +        SetMonData(mon, MON_DATA_MOVE1 + i, &move);
          +        SetMonData(mon, MON_DATA_PP1 + i, &pp);
          +    }
          +}
          +
          +static bool8 TrainerMonHasAbility(struct Pokemon *mon, AbilityEnum ability)
          +{
          +    return GetMonAbility(mon) == ability || MonHasInnate(mon, ability, FALSE);
          +}
          +
          +static u16 ChooseTrainerRandomizedHeldItem(struct Pokemon *mon, SpeciesEnum species,
          +                                          u16 trainerNum, u8 partySlot, bool8 *assignedMega)
          +{
          +    u32 seed = ((u32)VarGet(VAR_RANDOMIZED_SEED) << 16)
          +             ^ ((u32)trainerNum * 0x9E3779B9u) ^ ((u32)(partySlot + 1) * 0x85EBCA6Bu)
          +             ^ 0xA5A5A5A5u;
          +    _Static_assert(NUMBER_OF_MON_TYPES <= 32, "Type mask must fit in u32");
          +    u16 item = ITEM_SITRUS_BERRY;
          +    u16 totalWeight = 0;
          +    u8 level = GetMonData(mon, MON_DATA_LEVEL, NULL);
          +    u8 physical = 0, special = 0, status = 0, contact = 0;
          +    u32 attackTypes = 0;
          +    bool8 inaccurate = FALSE, multiHit = FALSE, sound = FALSE, punch = FALSE;
          +    bool8 charge = FALSE, facade = FALSE, screen = FALSE, rest = FALSE;
          +    bool8 rain = FALSE, sun = FALSE, snow = FALSE, sand = FALSE, fog = FALSE;
          +    u32 terrains = 0;
          +    bool8 selfDrop = FALSE, itemSwap = FALSE, statusTransfer = FALSE;
          +    bool8 binding = FALSE, gyroBall = FALSE, technoBlast = FALSE, multiAttack = FALSE;
          +
          +    if (!*assignedMega && level >= 35 && FlagGet(FLAG_SYS_RECEIVED_KEYSTONE)
          +        && CheckBagHasItem(ITEM_MEGA_BRACELET, 1) && RandRangeDeterministic(1, 5, &seed) == 1) {
          +        const struct Evolution *forms = gFormChangeTable[species];
          +        u16 eligibleStones = 0;
          +        u16 stone = ITEM_NONE;
          +        for (u16 i = 0; forms[i].method != 0; i++) {
          +            if (forms[i].method == EVO_MEGA_EVOLUTION
          +                && ItemId_GetHoldEffect(forms[i].param) == HOLD_EFFECT_MEGA_STONE
          +                && RandRangeDeterministic(1, ++eligibleStones, &seed) == 1)
          +                stone = forms[i].param;
          +        }
          +        if (stone != ITEM_NONE) {
          +            *assignedMega = TRUE;
          +            return stone;
          +        }
          +    }
           
          +    for (u8 slot = 0; slot < MAX_MON_MOVES; slot++) {
          +        u16 move = GetMonData(mon, MON_DATA_MOVE1 + slot, NULL);
          +        if (move == MOVE_NONE)
          +            continue;
          +
          +        const struct BattleMove *data = &gBattleMoves[move];
          +        if (data->split == SPLIT_STATUS) {
          +            status++;
          +        } else {
          +            physical += data->split == SPLIT_PHYSICAL;
          +            special += data->split == SPLIT_SPECIAL;
          +            attackTypes |= (u32)1 << data->type;
          +            punch |= (data->flags & FLAG_IRON_FIST_BOOST) != 0;
          +            contact += data->contact;
          +        }
          +        inaccurate |= data->accuracy > 0 && data->accuracy < 90;
          +        multiHit |= data->effect == EFFECT_MULTI_HIT && data->hitCountOverride == 0;
          +        sound |= (data->flags & FLAG_SOUND) != 0;
          +        charge |= data->twoTurnMove && !data->everyOtherTurn;
          +        facade |= move == MOVE_FACADE;
          +        rest |= move == MOVE_REST;
          +        screen |= move == MOVE_REFLECT || move == MOVE_LIGHT_SCREEN || move == MOVE_AURORA_VEIL;
          +        rain |= move == MOVE_RAIN_DANCE;
          +        sun |= move == MOVE_SUNNY_DAY;
          +        snow |= move == MOVE_HAIL || move == MOVE_CHILLY_RECEPTION;
          +        sand |= move == MOVE_SANDSTORM;
          +        fog |= move == MOVE_EERIE_FOG;
          +        if (move == MOVE_ELECTRIC_TERRAIN) terrains |= 1 << 0;
          +        if (move == MOVE_GRASSY_TERRAIN) terrains |= 1 << 1;
          +        if (move == MOVE_MISTY_TERRAIN) terrains |= 1 << 2;
          +        if (move == MOVE_PSYCHIC_TERRAIN) terrains |= 1 << 3;
          +        binding |= data->effect == EFFECT_TRAP;
