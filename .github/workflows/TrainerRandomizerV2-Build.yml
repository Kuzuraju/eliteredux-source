
name: Trainer Randomizer V2 - Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    env:
      TEST_BRANCH: trainer-randomizer-v2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
      DEBIAN_FRONTEND: noninteractive

    defaults:
      run:
        shell: bash

    steps:
      - name: Fetch Trainer Randomizer V2
        run: |
          set -euo pipefail
          mkdir -p work report
          cd work

          git init -q
          git remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            fetch --depth 1 --no-tags origin \
            "+refs/heads/${TEST_BRANCH}:refs/remotes/origin/${TEST_BRANCH}"

          git checkout -q --detach \
            "refs/remotes/origin/${TEST_BRANCH}"

          git rev-parse HEAD > ../report/source-commit.txt
          git log -1 --oneline

      - name: Verify ROM and prototype
        run: |
          set -euo pipefail
          cd work

          test -f rom.gba
          test -f src/battle_main.c
          test -f src/pokemon.c
          test -f src/ui_intro_options.c
          test -f include/global.h

          grep -q GetPrototypeTrainerSpecies src/battle_main.c
          grep -q trainerRandomizedMode include/global.h
          grep -q SETTING_TRAINER_RANDOMIZER_MODE src/ui_intro_options.c

          ls -lh rom.gba

          echo "Prototype verified." \
            > ../report/prototype-check.txt

      - name: Fetch official er-config
        run: |
          set -euo pipefail
          cd work

          git clone \
            https://github.com/Elite-Redux/er-config.git \
            proto

          git -C proto checkout --detach \
            8726330add2f24370dfcd1e9d4eff9bc7e6767b4

          git -C proto rev-parse HEAD \
            > ../report/config-commit.txt

          test -f proto/MoveList.textproto
          test -f proto/SpeciesList.textproto

      - name: Apply move metadata fixes
        run: |
          set -euo pipefail
          cd work

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("proto/MoveList.textproto")
          content = path.read_text()

          fixes = [
              (
                  "MOVE_SPARKLING_BLAST",
                  "short_name",
                  "SparklBlast",
              ),
              (
                  "MOVE_GLITTER_BEAM",
                  "description",
                  "A shining beam that lowers "
                  "the foe's accuracy. Light-based.",
              ),
          ]

          for move, field, replacement in fixes:
              pattern = (
                  r'(moves\s*\{\s*'
                  + r'id:\s*'
                  + re.escape(move)
                  + r'\b[^}]*?'
                  + re.escape(field)
                  + r':\s*")'
                  + r'(?:\\.|[^"\\])*'
                  + r'(")'
              )

              content, count = re.subn(
                  pattern,
                  lambda m, value=replacement:
                      m.group(1) + value + m.group(2),
                  content,
                  count=1,
                  flags=re.DOTALL,
              )

              print(
                  f"{move}: "
                  + ("patched" if count else "unchanged")
              )

          path.write_text(content)
          PY

      - name: Apply trainer species visibility bridge
        run: |
          set -euo pipefail
          cd work

          python3 - <<'PY'
          from pathlib import Path
          import re

          battle = Path("src/battle_main.c")
          pokemon = Path("src/pokemon.c")

          source = battle.read_text()
          target = pokemon.read_text()

          original = (
              "IsSpeciesRandomizerAllowed("
              "candidate, FALSE, TRUE)"
          )

          replacement = (
              "TrainerRandomizerSpeciesAllowed(candidate)"
          )

          if original in source:
              source = source.replace(
                  original, replacement
              )
              print("Replaced eligibility call.")
          elif replacement in source:
              print("Eligibility call already patched.")
          else:
              raise SystemExit(
                  "ERROR: Expected eligibility call not found."
              )

          declaration = (
              "extern bool8 "
              "TrainerRandomizerSpeciesAllowed(u16 species);"
          )

          source = re.sub(
              r'(?m)^[ \t]*extern bool8[ \t]+'
              r'TrainerRandomizerSpeciesAllowed'
              r'\(u16 species\);[ \t]*\n?',
              '',
              source
          )

          includes = list(
              re.finditer(
                  r'(?m)^[ \t]*#[ \t]*include[ \t]+'
                  r'[<"][^>"]+[>"][^\n]*(?:\n|$)',
                  source
              )
          )

          if not includes:
              raise SystemExit(
                  "ERROR: No includes found in battle_main.c."
              )

          position = includes[-1].end()

          source = (
              source[:position]
              + "\n"
              + declaration
              + "\n"
              + source[position:]
          )

          function = (
              "\nbool8 TrainerRandomizerSpeciesAllowed"
              "(u16 species)\n"
              "{\n"
              "    return IsSpeciesRandomizerAllowed("
              "species, FALSE, TRUE);\n"
              "}\n"
          )

          if not re.search(
              r'\bIsSpeciesRandomizerAllowed\s*\(',
              target
          ):
              raise SystemExit(
                  "ERROR: Eligibility function not found."
              )

          if not re.search(
              r'\bTrainerRandomizerSpeciesAllowed'
              r'\s*\([^)]*\)\s*\{',
              target
          ):
              target += function

          battle.write_text(source)
          pokemon.write_text(target)

          print("Visibility bridge prepared.")
          PY

          git diff -- \
            src/battle_main.c src/pokemon.c \
            > ../report/bridge.patch

      - name: Fix trainer randomizer Random declaration
        run: |
          set -euo pipefail
          cd work

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/ui_intro_options.c")
          source = path.read_text()

          if not re.search(
              r'\bRandom\s*\(\s*\)',
              source
          ):
              raise SystemExit(
                  "ERROR: Random() call not found."
              )

          if re.search(
              r'(?m)^\s*#\s*include\s*["<]random\.h[">]',
              source
          ):
              print("random.h already included.")
          else:
              includes = list(
                  re.finditer(
                      r'(?m)^[ \t]*#[ \t]*include[ \t]+'
                      r'[<"][^>"]+[>"][^\n]*(?:\n|$)',
                      source
                  )
              )

              if not includes:
                  raise SystemExit(
                      "ERROR: No includes found "
                      "in ui_intro_options.c."
                  )

              if not Path("include/random.h").is_file():
                  raise SystemExit(
                      "ERROR: include/random.h not found."
                  )

              position = includes[-1].end()

              source = (
                  source[:position]
                  + '#include "random.h"\n'
                  + source[position:]
              )

              path.write_text(source)
              print("Added #include \"random.h\".")

          assert '#include "random.h"' in source

          print("Random declaration fix prepared.")
          PY

          git diff -- \
            src/ui_intro_options.c \
            > ../report/random-header.patch

      - name: Build legal competitive trainer movesets
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('src/battle_main.c')
          s = p.read_text()
          anchor = 'static u8 CreateNPCTrainerParty(struct Pokemon* party, u16 trainerNum, bool8 firstTrainer) {'
          if s.count(anchor) != 1:
              raise SystemExit('Expected CreateNPCTrainerParty anchor not found exactly once')
          if '#include "tmhm_struct.h"' not in s:
              s = s.replace('#include "pokemon.h"', '#include "pokemon.h"\n#include "tmhm_struct.h"', 1)
          helper = r'''// V2.1 experimental: choose legal moves without consuming battle RNG.
          // Candidate sources: all level-up moves, egg moves and compatible tutors.
          static u32 TrainerMoveHash(u32 seed)
          {
              seed ^= seed >> 16;
              seed *= 0x7feb352du;
              seed ^= seed >> 15;
              seed *= 0x846ca68bu;
              return seed ^ (seed >> 16);
          }

          static bool8 TrainerMoveAlreadyChosen(u16 move, const u16 chosen[MAX_MON_MOVES], u8 count)
          {
              u8 k;
              for (k = 0; k < count; k++)
                  if (chosen[k] == move) return TRUE;
              return FALSE;
          }

          static s32 TrainerMoveScore(u16 move, SpeciesEnum species, u16 atk, u16 spAtk, u32 seed,
                                      const u16 chosen[MAX_MON_MOVES], u8 count)
          {
              s32 score;
              u8 k;
              u8 type;
              u16 power;
              if (move == MOVE_NONE) return -100000;
              if (gBattleMoves[move].effect == EFFECT_PLACEHOLDER) return -100000;
              if (TrainerMoveAlreadyChosen(move, chosen, count)) return -100000;
              power = gBattleMoves[move].power;
              type = gBattleMoves[move].type;
              score = (s32)(TrainerMoveHash(seed ^ (u32)move * 0x9e3779b9u) % 24);
              if (power != 0) {
                  score += 60 + (power > 140 ? 140 : power);
                  if (type == gBaseStats[species].type1 || type == gBaseStats[species].type2)
                      score += 48;
                  // Discourage repetitive offensive typing, not all duplicate roles.
                  for (k = 0; k < count; k++) {
                      if (gBattleMoves[chosen[k]].power != 0 && gBattleMoves[chosen[k]].type == type)
                          score -= 85;
                  }
                  // Reward naturally stronger attackers without assuming all moves are physical.
                  score += (atk > spAtk ? atk - spAtk : spAtk - atk) / 16;
              } else {
                  // Status moves are useful, but four random status moves usually are not.
                  u8 statusCount = 0;
                  score += 105;
                  for (k = 0; k < count; k++)
                      if (gBattleMoves[chosen[k]].power == 0) statusCount++;
                  if (statusCount >= 1) score -= 48;
                  if (statusCount >= 2) score -= 110;
                  // Explicitly reward common strategic utility; legal availability is still checked.
                  switch (move) {
                  case MOVE_SWORDS_DANCE:
                      score += atk >= spAtk ? 85 : -45;
                      break;
                  case MOVE_NASTY_PLOT:
                      score += spAtk >= atk ? 85 : -45;
                      break;
                  case MOVE_RECOVER:
                  case MOVE_ROOST:
                  case MOVE_SOFT_BOILED:
                  case MOVE_MOONLIGHT:
                  case MOVE_MORNING_SUN:
                  case MOVE_SYNTHESIS:
                  case MOVE_STEALTH_ROCK:
                  case MOVE_SPIKES:
                  case MOVE_TOXIC_SPIKES:
                  case MOVE_WILL_O_WISP:
                  case MOVE_THUNDER_WAVE:
                  case MOVE_TAUNT:
                  case MOVE_LEECH_SEED:
                  case MOVE_STRENGTH_SAP:
                      score += 65;
                      break;
                  default:
                      break;
                  }
              }
              return score;
          }

          static void SetCompetitiveTrainerMoves(struct Pokemon *mon, SpeciesEnum species, u16 trainerNum, u8 slot)
          {
              u16 levelMoves[MAX_LEVEL_UP_MOVES];
              u16 eggMoves[EGG_MOVES_ARRAY_COUNT];
              u16 selected[MAX_MON_MOVES] = {MOVE_NONE, MOVE_NONE, MOVE_NONE, MOVE_NONE};
              u8 levelCount = GetLevelUpMovesBySpecies(species, levelMoves);
              u8 eggCount = GetEggMoveTutorMoves(mon, eggMoves);
              u8 chosenCount = 0;
              u8 round;
              u16 t;
              u16 atk = GetMonData(mon, MON_DATA_ATK, NULL);
              u16 spAtk = GetMonData(mon, MON_DATA_SPATK, NULL);
              u32 seed = (u32)VarGet(VAR_RANDOMIZED_SEED) ^ ((u32)trainerNum * 0x9e3779b9u)
                         ^ ((u32)(slot + 1) * 0x85ebca6bu) ^ ((u32)species * 0xc2b2ae35u);
              for (round = 0; round < MAX_MON_MOVES; round++) {
                  u16 bestMove = MOVE_NONE;
                  s32 bestScore = -100000;
                  for (t = 0; t < levelCount; t++) {
                      s32 score = TrainerMoveScore(levelMoves[t], species, atk, spAtk, seed + round,
                                                   selected, chosenCount);
                      if (score > bestScore) { bestScore = score; bestMove = levelMoves[t]; }
                  }
                  for (t = 0; t < eggCount; t++) {
                      s32 score = TrainerMoveScore(eggMoves[t], species, atk, spAtk, seed + round,
                                                   selected, chosenCount);
                      if (score > bestScore) { bestScore = score; bestMove = eggMoves[t]; }
                  }
                  for (t = 0; t < TUTOR_COUNT; t++) {
                      u16 move;
                      s32 score;
                      if (!CanLearnTutorMove(species, t)) continue;
                      move = GetTutorMove(t);
                      score = TrainerMoveScore(move, species, atk, spAtk, seed + round,
                                               selected, chosenCount);
                      if (score > bestScore) { bestScore = score; bestMove = move; }
                  }
                  if (bestMove == MOVE_NONE) break;
                  selected[chosenCount++] = bestMove;
              }
              // Only write a generated set when there is at least one legal candidate.
              if (chosenCount != 0) {
                  for (round = 0; round < MAX_MON_MOVES; round++) {
                      u16 move = selected[round];
                      u8 pp;
                      SetMonData(mon, MON_DATA_MOVE1 + round, &move);
                      pp = CalculatePPWithBonus(move, GetMonData(mon, MON_DATA_PP_BONUSES, NULL), round);
                      SetMonData(mon, MON_DATA_PP1 + round, &pp);
                  }
              }
          }

          '''
          # Avoid accidental indentation: embedded source is kept as-is.
          s = s.replace(anchor, helper + anchor, 1)
          old = '''if (trainerNum == TRAINER_OLDPLAYER || prototypeRandomized) {'''
          new = '''if (prototypeRandomized) {
                SetCompetitiveTrainerMoves(&party[i], species, trainerNum, i);
            } else if (trainerNum == TRAINER_OLDPLAYER) {'''
          if s.count(old) != 1:
              raise SystemExit('Expected move-selection branch not found exactly once')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Installed experimental legal-movepool trainer selector')
          PYCODE
          git diff -- src/battle_main.c > ../report/competitive-moves.patch

      - name: Configure debug shortcut
        run: |
          set -euo pipefail
          cd work

          if [ -f include/debug.h ]; then
            sed -i -E \
              's/^(#define TX_DEBUG_SYSTEM_IN_MENU[[:space:]]+)TRUE/\1FALSE/' \
              include/debug.h
          fi

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check available dependencies
        run: |
          set -euo pipefail
          mkdir -p report

          {
            echo "Dependency preflight"
            date -u
            uname -a
            echo

            for command in \
              git \
              make \
              gcc \
              arm-none-eabi-gcc \
              arm-none-eabi-g++ \
              arm-none-eabi-as \
              wget \
              unzip \
              java
            do
              if command -v "$command" >/dev/null 2>&1; then
                echo "OK: $command"
              else
                echo "MISSING: $command"
              fi
            done

            echo
            dpkg-query -W \
              build-essential \
              git \
              libpng-dev \
              gcc-arm-none-eabi \
              binutils-arm-none-eabi \
              libnewlib-arm-none-eabi \
              libnewlib-dev \
              libstdc++-arm-none-eabi-dev \
              unzip \
              wget \
              2>&1 || true

          } | tee report/dependency-preflight.log

      - name: Install missing dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail

          {
            echo "Starting dependency installation"
            date -u

            REQUIRED=(
              build-essential
              git
              libpng-dev
              gcc-arm-none-eabi
              binutils-arm-none-eabi
              libnewlib-arm-none-eabi
              libnewlib-dev
              libstdc++-arm-none-eabi-dev
              unzip
              wget
            )

            MISSING=()

            for package in "${REQUIRED[@]}"; do
              if dpkg-query -W \
                -f='${Status}' "$package" 2>/dev/null \
                | grep -qx 'install ok installed'; then

                echo "Already installed: $package"
              else
                echo "Missing package: $package"
                MISSING+=("$package")
              fi
            done

            if [ "${#MISSING[@]}" -eq 0 ]; then
              echo "All packages already installed."
            else
              echo "Updating apt indexes..."

              timeout --signal=TERM --kill-after=15s \
                240s \
                sudo apt-get \
                  -o DPkg::Lock::Timeout=30 \
                  -o Acquire::Retries=2 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 \
                  update

              echo "Checking package availability..."

              for package in "${MISSING[@]}"; do
                echo "Package: $package"
                apt-cache policy "$package"
              done

              echo "Installing missing packages..."

              timeout --signal=TERM --kill-after=15s \
                300s \
                sudo apt-get \
                  -o DPkg::Lock::Timeout=30 \
                  -o Acquire::Retries=2 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 \
                  install -y --no-install-recommends \
                  "${MISSING[@]}"
            fi

            echo
            echo "Checking ARM compilers..."

            arm-none-eabi-gcc --version
            arm-none-eabi-g++ --version

            echo
            echo "Dependency installation completed."
            date -u

          } 2>&1 | tee report/dependencies.log

      - name: Verify ARM C standard headers
        run: |
          set -euo pipefail
          mkdir -p report

          {
            echo "Checking ARM C standard library"
            echo

            printf '#include <string.h>\nint main(void) { return 0; }\n' \
              | arm-none-eabi-gcc \
                  -x c \
                  -fsyntax-only \
                  -

            echo
            echo "ARM string.h check passed."

          } 2>&1 | tee report/arm-headers-check.log

      - name: Verify ARM C++ standard headers
        run: |
          set -euo pipefail
          mkdir -p report

          {
            echo "Checking ARM C++ standard library"
            echo

            printf '#include <cstddef>\nint main() { return 0; }\n' \
              | arm-none-eabi-g++ \
                  -x c++ \
                  -fsyntax-only \
                  -

            echo
            echo "ARM cstddef check passed."

            echo
            echo "C++ include search paths:"

            printf '' \
              | arm-none-eabi-g++ \
                  -x c++ \
                  -E -v - \
                  >/dev/null

          } 2>&1 | tee report/arm-cpp-headers-check.log

      - name: Install Kotlin 2.1.0
        timeout-minutes: 5
        run: |
          set -euo pipefail

          KOTLIN_VERSION=2.1.0

          wget --timeout=30 --tries=3 -q \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -O "$RUNNER_TEMP/kotlin.zip"

          mkdir -p "$RUNNER_TEMP/kotlin"

          unzip -q "$RUNNER_TEMP/kotlin.zip" \
            -d "$RUNNER_TEMP/kotlin"

          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" \
            >> "$GITHUB_PATH"

          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" \
            -version

      - name: Install Poryscript 3.5.2
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd work/tools

          rm -rf \
            poryscript \
            poryscript-linux \
            poryscript-linux.zip

          wget --timeout=30 --tries=3 -q \
            https://github.com/huderlem/poryscript/releases/download/3.5.2/poryscript-linux.zip \
            -O poryscript-linux.zip

          unzip -o -q poryscript-linux.zip

          mv poryscript-linux poryscript
          chmod +x poryscript

          rm poryscript-linux.zip

      - name: Adjust compiler flags
        run: |
          set -euo pipefail
          cd work

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Makefile")
          source = path.read_text()

          source = source.replace(
              "-std=gnu23",
              "-std=gnu2x",
          )

          source = re.sub(
              r"-Werror\b",
              "-Wno-error",
              source,
          )

          path.write_text(source)
          PY

      - name: Generate code
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cd work

          make -C tools/codegen \
            2>&1 | tee ../report/codegen.log

          test -f \
            include/generated/data/megas/legendary_sage.h

          test -f \
            include/generated/data/megas/adoption_center.h

      - name: Compile Trainer Randomizer V2
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd work

          make -j"$(nproc)" \
            2>&1 | tee ../report/build.log

          test -f pokeemerald_modern.gba

          ls -lh pokeemerald_modern.gba

          echo "Compilation successful." \
            > ../report/build-result.txt

      - name: Create and verify BPS patch
        run: |
          set -euo pipefail
          cd work

          chmod +x ./flips-linux

          ./flips-linux --create \
            rom.gba \
            pokeemerald_modern.gba \
            TrainerRandomizerV2.bps

          ./flips-linux --apply \
            TrainerRandomizerV2.bps \
            rom.gba \
            TrainerRandomizerV2.gba

          cmp \
            pokeemerald_modern.gba \
            TrainerRandomizerV2.gba

          echo "BPS verification successful." \
            > ../report/patch-result.txt

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainerRandomizerV2-Build-Report
          path: report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compiled ROM and patch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrainerRandomizerV2-Build
          path: |
            work/TrainerRandomizerV2.bps
            work/TrainerRandomizerV2.gba
          if-no-files-found: error
          retention-days: 14
