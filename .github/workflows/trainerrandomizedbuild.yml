
name: Trainer Randomizer Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0

    steps:
      - name: Checkout Trainer Randomizer test branch
        uses: actions/checkout@v4
        with:
          ref: trainer-randomizer-test
          submodules: false

      - name: Verify test branch and patch
        run: |
          set -euo pipefail

          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git log -1 --oneline

          grep -q 'trainerRandomizedMode' include/global.h
          grep -q 'SETTING_TRAINER_RANDOMIZER_MODE' src/ui_intro_options.c
          grep -q 'GetPrototypeTrainerSpecies' src/battle_main.c

          echo "Trainer Randomizer source detected."

      - name: Check base ROM
        run: |
          set -euo pipefail

          test -f rom.gba || {
            echo "ERROR: rom.gba was not found."
            exit 1
          }

          ls -lh rom.gba

      - name: Checkout proto files
        run: |
          set -euo pipefail

          rm -rf proto

          git clone --depth 1 --branch upcoming \
            https://github.com/Elite-Redux/er-config.git proto

          test -f proto/MoveList.textproto

          echo "Proto files downloaded."

      - name: Fix Sparkling Blast short name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("proto/MoveList.textproto")
          content = path.read_text()

          blocks = list(re.finditer(
              r'moves\s*\{[^}]*\}',
              content,
              re.DOTALL
          ))

          found = False
          modified = False

          for block in reversed(blocks):
              original = block.group()

              if not re.search(
                  r'\bid:\s*MOVE_SPARKLING_BLAST\b',
                  original
              ):
                  continue

              found = True

              updated, count = re.subn(
                  r'(short_name:\s*")'
                  r'(?:\\.|[^"\\])*'
                  r'(")',
                  lambda m: (
                      m.group(1)
                      + "SparklBlast"
                      + m.group(2)
                  ),
                  original,
                  count=1
              )

              if count == 1:
                  content = (
                      content[:block.start()]
                      + updated
                      + content[block.end():]
                  )
                  modified = True
              else:
                  print(
                      "Sparkling Blast found, "
                      "but short_name field is absent."
                  )

          if not found:
              print(
                  "NOTICE: MOVE_SPARKLING_BLAST "
                  "not found in MoveList.textproto."
              )
          elif modified:
              path.write_text(content)
              print(
                  "Sparkling Blast short_name corrected."
              )

          print("Continuing to code generation.")
          PY

      - name: Fix Glitter Beam description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("proto/MoveList.textproto")
          content = path.read_text()

          blocks = list(re.finditer(
              r'moves\s*\{[^}]*\}',
              content,
              re.DOTALL
          ))

          found = False
          modified = False

          description = (
              "A shining beam that lowers "
              "the foe's accuracy. Light-based."
          )

          for block in reversed(blocks):
              original = block.group()

              if not re.search(
                  r'\bid:\s*MOVE_GLITTER_BEAM\b',
                  original
              ):
                  continue

              found = True

              updated, count = re.subn(
                  r'(description:\s*")'
                  r'(?:\\.|[^"\\])*'
                  r'(")',
                  lambda m: (
                      m.group(1)
                      + description
                      + m.group(2)
                  ),
                  original,
                  count=1
              )

              if count == 1:
                  content = (
                      content[:block.start()]
                      + updated
                      + content[block.end():]
                  )
                  modified = True
              else:
                  print(
                      "Glitter Beam found, "
                      "but description field is absent."
                  )

          if not found:
              print(
                  "NOTICE: MOVE_GLITTER_BEAM "
                  "not found in MoveList.textproto."
              )
          elif modified:
              path.write_text(content)
              print(
                  "Glitter Beam description corrected."
              )

          print("Continuing to code generation.")
          PY

      - name: Disable overworld debug shortcut
        run: |
          set -euo pipefail

          sed -i -E \
            's/^(#define TX_DEBUG_SYSTEM_IN_MENU[[:space:]]+)TRUE/\1FALSE/' \
            include/debug.h

          grep -Eq \
            '^#define TX_DEBUG_SYSTEM_IN_MENU[[:space:]]+FALSE' \
            include/debug.h

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            libpng-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            unzip \
            wget

      # Important: select Java 17 explicitly.
      # Installing a JDK with apt does not guarantee
      # that it becomes the active Java version.
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

          JAVA_VERSION="$(java -version 2>&1 | head -n 1)"

          if [[ "$JAVA_VERSION" != *'"17.'* ]]; then
            echo "ERROR: Java 17 is not active."
            exit 1
          fi

          echo "Java 17 is active."

      - name: Install modern Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail

          KOTLIN_VERSION=2.1.0

          wget -q \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -O "$RUNNER_TEMP/kotlin.zip"

          mkdir -p "$RUNNER_TEMP/kotlin"

          unzip -q "$RUNNER_TEMP/kotlin.zip" \
            -d "$RUNNER_TEMP/kotlin"

          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

          echo "Testing Kotlin with Java 17..."

          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" -version

          echo "Kotlin compiler installed."

      - name: Download Poryscript
        run: |
          set -euo pipefail

          cd tools

          rm -rf \
            poryscript \
            poryscript-linux \
            poryscript-linux.zip

          wget -O poryscript-linux.zip \
            https://github.com/huderlem/poryscript/releases/download/3.5.2/poryscript-linux.zip

          unzip -o poryscript-linux.zip

          mv poryscript-linux poryscript

          rm poryscript-linux.zip

      - name: Fix compiler compatibility flags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Makefile")
          source = path.read_text()

          source = source.replace(
              "-std=gnu23",
              "-std=gnu2x"
          )

          source = re.sub(
              r"-Werror\b",
              "-Wno-error",
              source
          )

          path.write_text(source)

          if re.search(r"-Werror\b", source):
              raise SystemExit(
                  "ERROR: -Werror still present."
              )

          print(
              "Compiler compatibility flags updated."
          )
          PY

          grep -nE 'gnu2x|Wno-error' Makefile

      - name: Generate code before compilation
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java version ==="
          java -version

          echo "=== Kotlin version ==="
          kotlinc -version

          echo "=== Generating Elite Redux code ==="

          make -C tools/codegen 2>&1 | tee codegen.log

          echo "=== Checking generated headers ==="

          test -f include/generated/data/megas/legendary_sage.h
          test -f include/generated/data/megas/adoption_center.h

          echo "Generated headers found."

      - name: Build Trainer Randomizer ROM
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building Trainer Randomizer ==="

          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Verify compiled ROM
        run: |
          set -euo pipefail

          test -f pokeemerald_modern.gba
          ls -lh pokeemerald_modern.gba

      - name: Create BPS patch
        run: |
          set -euo pipefail

          chmod +x ./flips-linux

          ./flips-linux --create \
            rom.gba \
            pokeemerald_modern.gba \
            TrainerRandomizer.bps

          test -f TrainerRandomizer.bps

      - name: Apply BPS patch
        run: |
          set -euo pipefail

          ./flips-linux --apply \
            TrainerRandomizer.bps \
            rom.gba \
            TrainerRandomizer.gba

          test -f TrainerRandomizer.gba

      - name: Verify patched ROM
        run: |
          set -euo pipefail

          cmp \
            pokeemerald_modern.gba \
            TrainerRandomizer.gba

          echo "ROM verification successful."

      - name: Upload compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainerRandomizer-Diagnostics
          path: |
            codegen.log
            build.log
          if-no-files-found: ignore

      - name: Upload Trainer Randomizer ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrainerRandomizer-Test-ROM
          path: |
            TrainerRandomizer.bps
            TrainerRandomizer.gba
          if-no-files-found: error
