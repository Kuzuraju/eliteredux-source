
name: Trainer Randomizer Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0

    steps:
      - name: Checkout Trainer Randomizer test branch
        uses: actions/checkout@v4
        with:
          ref: trainer-randomizer-test
          submodules: false

      - name: Verify test branch and patch
        run: |
          set -euo pipefail

          echo "Current commit:"
          git log -1 --oneline

          grep -q 'trainerRandomizedMode' include/global.h
          grep -q 'SETTING_TRAINER_RANDOMIZER_MODE' src/ui_intro_options.c
          grep -q 'GetPrototypeTrainerSpecies' src/battle_main.c

          echo "Trainer Randomizer source detected."

      - name: Fix species randomizer function visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          battle_path = Path("src/battle_main.c")
          pokemon_path = Path("src/pokemon.c")

          battle = battle_path.read_text()
          pokemon = pokemon_path.read_text()

          old_call = (
              "IsSpeciesRandomizerAllowed("
              "candidate, FALSE, TRUE)"
          )

          new_call = (
              "TrainerRandomizerSpeciesAllowed(candidate)"
          )

          if battle.count(old_call) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one trainer "
                  "species filter call."
              )

          if "IsSpeciesRandomizerAllowed(" not in pokemon:
              raise SystemExit(
                  "ERROR: Species filter not found in pokemon.c."
              )

          declaration = (
              "\nextern bool8 "
              "TrainerRandomizerSpeciesAllowed(u16 species);\n"
          )

          marker = (
              "static SpeciesEnum "
              "GetPrototypeTrainerSpecies("
          )

          if battle.count(marker) != 1:
              raise SystemExit(
                  "ERROR: Trainer randomizer helper "
                  "not found."
              )

          battle = battle.replace(
              marker,
              declaration + "\n" + marker,
              1
          )

          battle = battle.replace(
              old_call,
              new_call,
              1
          )

          wrapper = """

          // Bridge for the experimental trainer randomizer.
          bool8 TrainerRandomizerSpeciesAllowed(u16 species)
          {
              return IsSpeciesRandomizerAllowed(
                  species, FALSE, TRUE
              );
          }
          """

          pokemon += wrapper

          battle_path.write_text(battle)
          pokemon_path.write_text(pokemon)

          print("Species filter bridge installed.")
          PY

      - name: Check base ROM
        run: |
          set -euo pipefail

          test -f rom.gba || {
            echo "ERROR: rom.gba was not found."
            exit 1
          }

          ls -lh rom.gba

      - name: Checkout proto files
        run: |
          set -euo pipefail

          rm -rf proto

          git clone --depth 1 --branch upcoming \
            https://github.com/Elite-Redux/er-config.git proto

          test -f proto/MoveList.textproto

      - name: Fix proto move metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("proto/MoveList.textproto")
          content = path.read_text()

          changes = {
              "MOVE_SPARKLING_BLAST": (
                  "short_name",
                  "SparklBlast"
              ),
              "MOVE_GLITTER_BEAM": (
                  "description",
                  "A shining beam that lowers "
                  "the foe's accuracy. Light-based."
              ),
          }

          blocks = list(re.finditer(
              r'moves\s*\{[^}]*\}',
              content,
              re.DOTALL
          ))

          for block in reversed(blocks):
              original = block.group()
              updated = original

              for move_id, (field, value) in changes.items():
                  if not re.search(
                      rf'\bid:\s*{move_id}\b',
                      original
                  ):
                      continue

                  pattern = (
                      rf'({field}:\s*")'
                      r'(?:\\.|[^"\\])*'
                      r'(")'
                  )

                  updated, count = re.subn(
                      pattern,
                      lambda m: (
                          m.group(1) + value + m.group(2)
                      ),
                      updated,
                      count=1
                  )

                  if count:
                      print(f"Updated {move_id}: {field}")
                  else:
                      print(
                          f"NOTICE: {move_id} has no "
                          f"{field} field."
                      )

              if updated != original:
                  content = (
                      content[:block.start()]
                      + updated
                      + content[block.end():]
                  )

          path.write_text(content)
          PY

      - name: Disable overworld debug shortcut
        run: |
          set -euo pipefail

          sed -i -E \
            's/^(#define TX_DEBUG_SYSTEM_IN_MENU[[:space:]]+)TRUE/\1FALSE/' \
            include/debug.h

          grep -Eq \
            '^#define TX_DEBUG_SYSTEM_IN_MENU[[:space:]]+FALSE' \
            include/debug.h

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            libpng-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            unzip \
            wget

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java 17
        run: |
          set -euo pipefail

          java -version
          javac -version

          JAVA_VERSION="$(java -version 2>&1 | head -n 1)"

          if [[ "$JAVA_VERSION" != *'"17.'* ]]; then
            echo "ERROR: Java 17 is not active."
            exit 1
          fi

      - name: Install Kotlin compiler
        run: |
          set -euo pipefail

          KOTLIN_VERSION=2.1.0

          wget -q \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -O "$RUNNER_TEMP/kotlin.zip"

          mkdir -p "$RUNNER_TEMP/kotlin"

          unzip -q "$RUNNER_TEMP/kotlin.zip" \
            -d "$RUNNER_TEMP/kotlin"

          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" -version

      - name: Download Poryscript
        run: |
          set -euo pipefail

          cd tools

          rm -rf \
            poryscript \
            poryscript-linux \
            poryscript-linux.zip

          wget -O poryscript-linux.zip \
            https://github.com/huderlem/poryscript/releases/download/3.5.2/poryscript-linux.zip

          unzip -o poryscript-linux.zip

          mv poryscript-linux poryscript

          rm poryscript-linux.zip

      - name: Fix compiler compatibility flags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Makefile")
          source = path.read_text()

          source = source.replace(
              "-std=gnu23",
              "-std=gnu2x"
          )

          source = re.sub(
              r"-Werror\b",
              "-Wno-error",
              source
          )

          path.write_text(source)

          if re.search(r"-Werror\b", source):
              raise SystemExit(
                  "ERROR: -Werror still present."
              )

          print("Compiler compatibility flags updated.")
          PY

      - name: Generate code before compilation
        run: |
          set -euo pipefail

          echo "=== Generating Elite Redux code ==="

          make -C tools/codegen 2>&1 | tee codegen.log

          test -f include/generated/data/megas/legendary_sage.h
          test -f include/generated/data/megas/adoption_center.h

          echo "Generated headers found."

      - name: Build Trainer Randomizer ROM
        run: |
          set -euo pipefail

          echo "=== Building Trainer Randomizer ==="

          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Verify compiled ROM
        run: |
          set -euo pipefail

          test -f pokeemerald_modern.gba
          ls -lh pokeemerald_modern.gba

      - name: Create BPS patch
        run: |
          set -euo pipefail

          chmod +x ./flips-linux

          ./flips-linux --create \
            rom.gba \
            pokeemerald_modern.gba \
            TrainerRandomizer.bps

          test -f TrainerRandomizer.bps

      - name: Apply BPS patch
        run: |
          set -euo pipefail

          ./flips-linux --apply \
            TrainerRandomizer.bps \
            rom.gba \
            TrainerRandomizer.gba

          test -f TrainerRandomizer.gba

      - name: Verify patched ROM
        run: |
          set -euo pipefail

          cmp \
            pokeemerald_modern.gba \
            TrainerRandomizer.gba

          echo "ROM verification successful."

      - name: Upload compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainerRandomizer-Diagnostics
          path: |
            codegen.log
            build.log
          if-no-files-found: ignore

      - name: Upload Trainer Randomizer ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrainerRandomizer-Test-ROM
          path: |
            TrainerRandomizer.bps
            TrainerRandomizer.gba
          if-no-files-found: error
